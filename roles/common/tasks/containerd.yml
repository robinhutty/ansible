# vi: ft=yaml
# Prepare containerd including nerdctl so we can run OCI containers
# Uses OS package manager for containerd, etc.
# Uses homebrew to provide nerdctl
# If using rootless mode (https://github.com/containerd/nerdctl#rootless-mode), also use homebrew packages

- name: Installing packages
  become: true
  ansible.builtin.package:
    name: "{{ item }}"
    state: latest
  loop: "{{ common_containerd.rootless.enabled | ternary(common_containerd.rootless.packages,common_containerd.packages) }}"

- name: Install nerdctl Homebrew formula
  become: false
  environment:
    NONINTERACTIVE: 1
  ansible.builtin.homebrew:
    name: nerdctl
    state: latest

