# vi: ft=yaml
---
- name: "Restart composed service homepage"
  become: true
  ansible.builtin.command:
    cmd: "nerdctl compose restart homepage"
    chdir: "/home/{{ users.0.username }}/compose/"

# - name: "Restart composed service TODO"
#   become: true
#   ansible.builtin.command:
#     cmd: "nerdctl compose restart TODO"
#     chdir: "/home/{{ users.0.username }}/compose/"

- name: "Restart composed Caddy"
  become: true
  ansible.builtin.command:
    cmd: "nerdctl compose restart caddy"
    chdir: "/home/{{ users.0.username }}/compose/"

- name: Restart systemd-resolved
  become: true
  ansible.builtin.service:
    name: systemd-resolved
    state: restarted

- name: Restart nsd
  become: true
  ansible.builtin.service:
    name: nsd
    state: restarted

- name: Restart unbound
  become: true
  ansible.builtin.service:
    name: unbound
    state: restarted
